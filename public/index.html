<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Quem Sou Eu? | Jogo Multiplayer em Tempo Real (Estilo Gartic)</title>
    <meta
      name="description"
      content="Jogo multiplayer em tempo real 'Quem Sou Eu?' com dinâmica de salas, QR Code, turnos e chat de palpites com validação automática estilo Gartic."
    />
    <meta name="theme-color" content="#0b0f19" />
    <link rel="icon" type="image/png" href="/images/logo.png" />

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Plus Jakarta Sans", "sans-serif"]
            }
          }
        }
      };
    </script>

    <!-- Estilos Customizados -->
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="bg-[#0b0f19] text-slate-100 min-h-screen selection:bg-cyan-500 selection:text-slate-900">
    <!-- Canvas de Confetes -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Container Flutuante para Toasts -->
    <div
      id="toast-container"
      class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-sm w-full"
    ></div>

    <!-- Aplicação Principal -->
    <main id="app" class="relative z-10 w-full min-h-screen"></main>

    <!-- Biblioteca Cliente do Socket.io fornecida nativamente pelo servidor Node.js -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Script de Inicialização da Aplicação (Módulos ES) -->
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
