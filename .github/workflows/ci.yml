name: CI - Verificação e Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Testes e Validação
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Testes Automatizados
        run: npm test

      - name: Validar Sintaxe dos Arquivos JavaScript
        run: |
          node --check server.js
          node --check lib/game-manager.js
          node --check lib/socket-handler.js
          node --check lib/server-utils.js
          node --check lib/words.js
          node --check public/js/chat.js
          node --check public/js/ui-render.js
          node --check public/js/socket.js
          node --check public/js/state.js
          node --check public/js/audio.js
          node --check public/js/app.js
          node --check test/queue-and-scoring.test.js

      - name: Testar Inicialização do Servidor
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 4
          curl -f http://localhost:5173/api/info || exit 1
          curl -f "http://localhost:5173/api/qr?data=test" || exit 1
          kill $SERVER_PID

      - name: Validar Build Docker
        run: |
          docker build -t quem-sou-eu:test .
